/* PROCTORAVA responsive, accessible application shell */
html{min-height:100%;scroll-padding-top:5rem}
body{min-height:100%;height:auto;overflow-x:hidden}
#app{min-height:100vh;min-height:100dvh}
.app{grid-template-columns:268px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.main{min-width:0;min-height:100vh;min-height:100dvh}
.page{width:100%;max-width:1600px;margin-inline:auto;padding:clamp(22px,2.6vw,48px) clamp(16px,2.8vw,44px) max(72px,env(safe-area-inset-bottom))}
.page>*{min-width:0}
img,svg,video,canvas{max-width:100%}
.card,.panel,.chart-card,.acard,.bird-card,.qcard,.proctor-card{min-width:0}
.grid2,.grid3,.acards,.birds,.pillars,.proof-grid,.rank-grid,.mc{min-width:0}
.grid2>*,.grid3>*,.acards>*,.birds>*,.pillars>*,.proof-grid>*,.rank-grid>*,.mc>*{min-width:0}
p,h1,h2,h3,h4,small,label,button,a,li{overflow-wrap:anywhere}
input,select,textarea,button{max-width:100%}
button,.btn,.input,select,textarea{touch-action:manipulation}
button,.btn{min-height:44px}
.input,select,textarea{min-height:44px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--clay2);outline-offset:3px}
.skip-link{position:fixed;left:12px;top:12px;z-index:200;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;transform:translateY(-160%);transition:transform .18s}
.skip-link:focus{transform:translateY(0)}
/* Image captions stay in their own content area, never on top of artwork. */
.acard img,.bird-card img{position:relative}
.acard .b,.bird-card .t{position:relative;z-index:auto}
.pip .pip-label{position:static;display:block;background:var(--ink);color:var(--bg);padding:5px 8px}
.drawer{max-width:100vw;max-height:100dvh}
.drawer-body{overscroll-behavior:contain;padding:clamp(14px,2vw,28px)}
.toast{max-width:calc(100vw - 24px);text-align:center}
@media(min-width:1800px){
 .page{max-width:1720px}
 .page.narrow{max-width:900px}
}
@media(max-width:1024px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{position:fixed;left:0;top:0;bottom:0;width:min(320px,88vw);height:100dvh;transform:translateX(-105%);z-index:45;overscroll-behavior:contain}
 .app.nav-open .side{transform:translateX(0)}
 .app.nav-open .scrim{display:block;position:fixed;inset:0;background:#14141370;z-index:40}
 .topbar{display:flex;position:sticky;top:0;z-index:25;padding-top:env(safe-area-inset-top)}
 .page{padding-top:clamp(18px,3vw,28px)}
}
@media(max-width:760px){
 .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
 .page{padding-left:16px;padding-right:16px}
 .section{margin-top:44px}
 .drawer{left:0;right:0;width:100%;border-left:0}
 .drawer-head{padding-top:max(12px,env(safe-area-inset-top))}
}
@media(max-width:560px){
 body{font-size:15px}
 .page{padding:16px 14px max(76px,env(safe-area-inset-bottom))}
 .card,.chart-card{padding:16px}
 .row{gap:8px}
 .row>.btn{flex:1 1 auto}
 .topbar{padding-left:14px;padding-right:14px}
 .topbar .brand b{font-size:18px}
 .pip{right:10px;bottom:max(10px,env(safe-area-inset-bottom))}
 .cert-wrap{overflow-x:auto;overscroll-behavior-x:contain}
}
@media(hover:none){
 .bird-card:hover,.acard:hover,.vcard:hover,.rtile:hover{transform:none}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

ion",color:"#D08A1E",meaning:"Inner drive to achieve for its own sake; optimism and persistence.",high:"You are self-driven, persistent and optimistic in the face of obstacles.",moderate:"You are motivated, especially when goals feel meaningful, though energy can dip with setbacks.",low:"You may rely more on external rewards or deadlines. Clear goals and visible progress help."},EM:{name:"Empathy",color:"#5E8C6A",meaning:"Sensing others\u2019 feelings and perspectives and taking them into account.",high:"You pick up unspoken feelings and consider others\u2019 perspectives in decisions.",moderate:"You are considerate of others, especially when their feelings are expressed openly.",low:"You may focus on tasks over feelings. Active listening and checking assumptions help."},SS:{name:"Social skills",color:"#4E6A8E",meaning:"Building rapport, influencing, resolving conflict and giving feedback well.",high:"You build rapport easily, resolve disagreements constructively and influence without authority.",moderate:"You work well with others and handle most interpersonal situations effectively.",low:"Interpersonal situations may feel effortful. Practising structured feedback and conflict conversations helps."}},items:[T("sa1","SA","I can name what I am feeling as it happens."),T("sr1","SR","I stay composed when I am criticised."),T("mo1","MO","I set challenging goals for myself, even when no one requires it."),T("em1","EM","I can sense how someone feels even when they don\u2019t say it."),T("ss1","SS","I can resolve disagreements in a way that keeps relationships intact."),T("sa2","SA","I know which situations tend to trigger strong emotions in me."),T("sr2","SR","I think before reacting when I am upset."),T("mo2","MO","I stay optimistic when I face obstacles."),T("em2","EM","I listen fully before forming my response."),T("ss2","SS","I find it easy to build rapport with new colleagues."),T("sa3","SA","I understand how my moods affect the people around me."),T("sr3","SR","I so
